<style>
  :root {
    /* モダンなカラーパレット */
    --primary: #4f46e5;       /* インディゴ */
    --primary-hover: #4338ca;
    --primary-light: #e0e7ff;
    --bg: #f8fafc;            /* わずかに青みがかった明るいグレー */
    --card-bg: #ffffff;
    --border: #e2e8f0;
    --text-main: #0f172a;
    --text-sub: #64748b;
    --danger: #ef4444;        /* レッド */
    --danger-light: #fef2f2;
    --success: #10b981;       /* エメラルド */
    --warning: #f59e0b;       /* アンバー */
    
    /* 角丸と影の設定 */
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
    --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.05);
    --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.05);
    --shadow-float: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
  }

  * { box-sizing: border-box; }
  
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text-main);
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  #app { display: flex; flex-direction: column; min-height: 100vh; }

  /* ヘッダー */
  header {
    background: #ffffff;
    color: var(--text-main);
    padding: 16px 20px;
    box-shadow: var(--shadow-sm);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 { 
    font-size: 18px; 
    margin: 0; 
    font-weight: 700;
    background: linear-gradient(90deg, #4f46e5, #3b82f6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  main { flex: 1; padding: 20px 16px 100px; }

  /* タブ切り替えアニメーション */
  .tab-content { 
    display: none; 
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.3s ease, transform 0.3s ease;
  }
  .tab-content.active { 
    display: block; 
    opacity: 1;
    transform: translateY(0);
  }

  /* タブバー（グラスモーフィズム） */
  #tabbar {
    position: fixed; bottom: 0; left: 0; right: 0;
    display: flex;
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid rgba(226, 232, 240, 0.8);
    padding-bottom: env(safe-area-inset-bottom);
    z-index: 100;
  }
  .tab-btn {
    flex: 1; padding: 12px 0; border: none; background: transparent;
    color: var(--text-sub);
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    cursor: pointer; transition: all 0.2s ease;
  }
  .tab-btn:active { transform: scale(0.95); }
  .tab-btn .material-symbols-outlined { font-size: 24px; transition: all 0.2s; }
  .tab-btn .tab-label { font-size: 10px; font-weight: 600; }
  .tab-btn.active { color: var(--primary); }
  .tab-btn.active .material-symbols-outlined {
    font-variation-settings: 'FILL' 1;
    transform: translateY(-2px);
  }

  /* カードデザイン */
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: var(--shadow-sm);
    transition: box-shadow 0.2s ease;
  }
  .card:hover { box-shadow: var(--shadow-md); }
  .card h2 { 
    font-size: 16px; margin: 0 0 12px; color: var(--text-main); font-weight: 700;
    display: flex; align-items: center; gap: 6px;
  }
  .icon-title { color: var(--primary); font-size: 20px; }
  
  .hint { font-size: 12px; color: var(--text-sub); margin: 0 0 16px; line-height: 1.5; }

  /* フォーム要素 */
  textarea, input[type="date"], input[type="number"] {
    width: 100%;
    background: var(--bg);
    border: 2px solid transparent;
    border-radius: var(--radius-md);
    padding: 12px;
    font-size: 14px;
    margin-bottom: 12px;
    font-family: inherit;
    color: var(--text-main);
    transition: all 0.2s ease;
  }
  textarea:focus, input:focus {
    background: var(--card-bg);
    border-color: var(--primary-light);
    outline: none;
    box-shadow: 0 0 0 4px var(--primary-light);
  }

  .form-row { display: flex; gap: 10px; align-items: center; }
  .form-row input { margin-bottom: 0; }
  .form-row-vertical label {
    display: block; font-size: 13px; color: var(--text-sub); margin-bottom: 12px; font-weight: 500;
  }
  .form-row-vertical input { margin-top: 6px; }

  /* ボタン */
  button { font-family: inherit; cursor: pointer; }
  .btn-primary, .btn-secondary {
    border: none; border-radius: var(--radius-md); padding: 12px 20px;
    font-size: 14px; font-weight: 600; white-space: nowrap;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    transition: all 0.2s ease;
  }
  .btn-primary { 
    background: var(--primary); color: #fff; 
    box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2);
  }
  .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); }
  .btn-primary:active { transform: scale(0.98); }
  
  .btn-secondary { background: var(--bg); color: var(--text-main); font-weight: 600; }
  .btn-secondary:hover { background: #e2e8f0; }
  .btn-secondary:active { transform: scale(0.98); }

  /* メッセージ表示 */
  .result-msg { font-size: 13px; margin-top: 8px; min-height: 18px; font-weight: 500; }
  .result-msg.success { color: var(--success); }
  .result-msg.error { color: var(--danger); }

  /* グラフコントロール */
  .period-type-controls { 
    display: flex; gap: 8px; margin-bottom: 16px; 
    background: var(--bg); padding: 4px; border-radius: var(--radius-md);
  }
  .period-type-btn {
    flex: 1; padding: 10px 0; border-radius: var(--radius-sm);
    border: none; background: transparent; color: var(--text-sub); font-size: 13px; font-weight: 600;
    transition: all 0.2s;
  }
  .period-type-btn.active { 
    background: var(--card-bg); color: var(--text-main); 
    box-shadow: var(--shadow-sm); 
  }

  .period-nav {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px; padding: 0 10px;
  }
  .icon-btn {
    border: none; background: var(--card-bg); color: var(--text-sub);
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow-sm); transition: all 0.2s;
  }
  .icon-btn:hover { color: var(--primary); transform: scale(1.05); }
  .icon-btn:active { transform: scale(0.95); }
  #period-label { font-size: 16px; font-weight: 700; }

  .chart-wrap { 
    background: var(--card-bg); border: 1px solid var(--border); 
    border-radius: var(--radius-lg); padding: 16px 10px; 
    box-shadow: var(--shadow-sm);
  }

  .target-summary {
    margin-top: 16px; font-size: 13px; color: var(--text-sub); text-align: center;
    line-height: 1.6; background: var(--card-bg); padding: 12px; 
    border-radius: var(--radius-md); border: 1px dashed var(--border);
  }

  /* 履歴リスト */
  .section-header h2 { font-size: 18px; margin: 0 0 16px; color: var(--text-main); }
  .loading-text { text-align: center; color: var(--text-sub); font-size: 14px; padding: 20px; }
  
  .history-item {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: var(--shadow-sm);
  }
  .history-item .h-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px; border-bottom: 1px solid var(--bg); padding-bottom: 8px;
  }
  .history-item .h-date { font-weight: 700; font-size: 15px; color: var(--primary); }
  
  .history-item .h-detail { 
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    color: var(--text-sub); font-size: 12px; margin-bottom: 12px; 
  }
  .h-detail-item strong { color: var(--text-main); font-size: 13px; margin-left: 4px;}
  
  .history-item .h-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .history-item .h-actions button {
    border: none; font-size: 12px; padding: 6px 12px; border-radius: var(--radius-sm);
    font-weight: 600; display: flex; align-items: center; gap: 4px;
    background: var(--bg); color: var(--text-sub);
  }
  .history-item .h-actions button:hover { background: #e2e8f0; }
  .history-item .h-actions button.meals { background: var(--primary-light); color: var(--primary-hover); }
  .history-item .h-actions button.del { background: var(--danger-light); color: var(--danger); }

  /* モーダルダイアログ */
  #dialog-overlay, #edit-dialog-overlay, #meal-dialog-overlay {
    position: fixed; inset: 0; background: rgba(15, 23, 42, 0.4);
    backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    padding: 20px; z-index: 1000;
    opacity: 1; transition: opacity 0.2s ease;
  }
  #dialog-overlay.hidden, #edit-dialog-overlay.hidden, #meal-dialog-overlay.hidden { 
    opacity: 0; pointer-events: none; 
  }
  
  #dialog-box {
    background: var(--card-bg); border-radius: var(--radius-lg); 
    padding: 24px; width: 100%; max-width: 360px;
    box-shadow: var(--shadow-float);
    transform: scale(1); transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .hidden #dialog-box { transform: scale(0.95); }
  
  #dialog-box h3 { margin: 0 0 16px; font-size: 18px; color: var(--text-main); }
  #dialog-box p { font-size: 14px; color: var(--text-sub); line-height: 1.5; margin-bottom: 20px; }
  
  .dialog-buttons { display: flex; gap: 10px; margin-top: 20px; }
  .dialog-buttons button { flex: 1; }

  /* 食事詳細内 */
  .meal-group { margin-bottom: 16px; background: var(--bg); padding: 12px; border-radius: var(--radius-md); }
  .meal-group-title { font-weight: 700; font-size: 14px; margin-bottom: 8px; display: flex; justify-content: space-between;}
  .meal-group-total { color: var(--primary); }
  .meal-item-row {
    display: flex; justify-content: space-between; font-size: 13px; color: var(--text-sub);
    padding: 6px 0; border-bottom: 1px solid rgba(0,0,0,0.05);
  }
  .meal-item-row:last-child { border-bottom: none; padding-bottom: 0; }
</style>
