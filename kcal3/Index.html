<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <!-- モダンなフォントとアイコンを読み込み -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  
  <?!= include('Stylesheet'); ?>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
  <div id="app">
    <header>
      <h1>カロリー収支管理</h1>
    </header>

    <main>
      <!-- ==================== グラフタブ ==================== -->
      <section id="tab-graph" class="tab-content active">
        <div class="period-type-controls">
          <button class="period-type-btn active" data-type="week">週間</button>
          <button class="period-type-btn" data-type="month">月間</button>
        </div>
        <div class="period-nav">
          <button id="prev-period" aria-label="前へ" class="icon-btn">
            <span class="material-symbols-outlined">chevron_left</span>
          </button>
          <span id="period-label">-</span>
          <button id="next-period" aria-label="次へ" class="icon-btn">
            <span class="material-symbols-outlined">chevron_right</span>
          </button>
        </div>
        <div class="chart-wrap">
          <canvas id="balanceChart"></canvas>
        </div>
        <div id="target-summary" class="target-summary"></div>
      </section>

      <!-- ==================== データ入力タブ ==================== -->
      <section id="tab-input" class="tab-content">
        <div class="card">
          <h2><span class="material-symbols-outlined icon-title">data_object</span> Claudeデータ取込み（JSON）</h2>
          <p class="hint">1日分または複数日分の配列を貼り付けてください。食事メニューを入れると摂取カロリーは自動計算されます。</p>
          <textarea id="json-input" rows="6"
            placeholder='{"date":"2026-08-18","exercise_kcal":400,"weight_kg":68.5,"meals":[{"type":"朝食","items":[{"name":"卵かけご飯","kcal":300}]}]}'></textarea>
          <button id="import-json-btn" class="btn-primary">
            <span class="material-symbols-outlined">upload</span> 取り込む
          </button>
          <div id="import-result" class="result-msg"></div>
        </div>

        <div class="card">
          <h2><span class="material-symbols-outlined icon-title">scale</span> 体重を手入力</h2>
          <div class="form-row">
            <input type="date" id="weight-date">
            <input type="number" step="0.1" id="weight-value" placeholder="体重 (kg)">
            <button id="save-weight-btn" class="btn-secondary">保存</button>
          </div>
          <div id="weight-result" class="result-msg"></div>
        </div>

        <div class="card">
          <h2><span class="material-symbols-outlined icon-title">directions_run</span> 運動消費カロリーを手入力</h2>
          <div class="form-row">
            <input type="date" id="exercise-date">
            <input type="number" id="exercise-value" placeholder="消費 (kcal)">
            <button id="save-exercise-btn" class="btn-secondary">保存</button>
          </div>
          <div id="exercise-result" class="result-msg"></div>
        </div>
      </section>

      <!-- ==================== 履歴編集タブ ==================== -->
      <section id="tab-history" class="tab-content">
        <div class="section-header">
          <h2>履歴一覧</h2>
        </div>
        <div id="history-list">
          <div class="loading-text">読み込み中...</div>
        </div>
      </section>
    </main>

    <!-- 下部タブナビゲーション -->
    <nav id="tabbar">
      <button class="tab-btn active" data-tab="graph">
        <span class="material-symbols-outlined">bar_chart</span>
        <span class="tab-label">グラフ</span>
      </button>
      <button class="tab-btn" data-tab="input">
        <span class="material-symbols-outlined">edit_square</span>
        <span class="tab-label">入力</span>
      </button>
      <button class="tab-btn" data-tab="history">
        <span class="material-symbols-outlined">history</span>
        <span class="tab-label">履歴</span>
      </button>
    </nav>
  </div>

  <!-- 上書き確認ダイアログ -->
  <div id="dialog-overlay" class="hidden">
    <div id="dialog-box">
      <h3>上書きの確認</h3>
      <p id="dialog-message"></p>
      <div class="dialog-buttons">
        <button id="dialog-cancel" class="btn-secondary">キャンセル</button>
        <button id="dialog-confirm" class="btn-primary">上書きする</button>
      </div>
    </div>
  </div>

  <!-- 食事詳細ダイアログ -->
  <div id="meal-dialog-overlay" class="hidden">
    <div id="dialog-box">
      <h3 id="meal-dialog-title">食事詳細</h3>
      <div id="meal-dialog-content"></div>
      <div class="dialog-buttons">
        <button id="meal-dialog-close" class="btn-secondary">閉じる</button>
      </div>
    </div>
  </div>

  <!-- 編集ダイアログ -->
  <div id="edit-dialog-overlay" class="hidden">
    <div id="dialog-box">
      <h3>データ編集</h3>
      <div class="form-row-vertical">
        <label>日付<input type="date" id="edit-date" disabled></label>
        <label>摂取kcal<input type="number" id="edit-intake"></label>
        <label>運動消費kcal<input type="number" id="edit-exercise"></label>
        <label>体重kg<input type="number" step="0.1" id="edit-weight"></label>
      </div>
      <div class="dialog-buttons">
        <button id="edit-cancel" class="btn-secondary">キャンセル</button>
        <button id="edit-save" class="btn-primary">保存</button>
      </div>
    </div>
  </div>

  <?!= include('JavaScript'); ?>
</body>
</html>
