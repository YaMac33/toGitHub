# モデルカタログ
#
# コードにモデル名を直接書かず、ここで管理します。
#
# status:
#   verified    … 実在を確認済みのモデルID（確認元を notes に記載）
#   unverified  … 過去に存在したが、現時点で利用可能か未確認。利用前に公式ドキュメントで確認すること
#   placeholder … 仮の値。実在するモデルとして扱わないこと
#   offline     … APIを呼ばないローカル用（mock プロバイダー）
#
# 料金: USD / 100万トークン (per million tokens)
#   null = 料金未設定。利用記録では「料金未設定」と表示され、0円としては扱われません。
#   料金は各社の公式料金ページで確認して記入してください（docs/api-configuration.md 参照）。
#
# context_window / max_output_tokens: トークン数。null = 未設定
# capabilities: 利用可能な機能のタグ（text, vision, tools, reasoning など自由記述）

