<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <?!= include('Stylesheet'); ?>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
  <div id="app">
    <header>
      <h1>カロリー収支</h1>
      <span id="header-date"></span>
    </header>

    <main>
      <!-- ==================== グラフタブ ==================== -->
      <section id="tab-graph" class="tab-content active">

        <!-- 今日の状態カード -->
        <div class="hero-card" id="today-card">
          <div class="hero-loading">読み込み中...</div>
        </div>

        <!-- 目標体重の進捗 -->
        <div class="goal-card" id="goal-card"></div>

        <!-- 期間グラフ -->
        <div class="period-type-controls">
          <button class="period-type-btn active" data-type="week">週間</button>
          <button class="period-type-btn" data-type="month">月間</button>
        </div>
        <div class="period-nav">
          <button id="prev-period" aria-label="前の期間" class="icon-btn">
            <span class="material-symbols-outlined">chevron_left</span>
          </button>
          <span id="period-label">-</span>
          <button id="next-period" aria-label="次の期間" class="icon-btn">
            <span class="material-symbols-outlined">chevron_right</span>
          </button>
        </div>
        <div class="chart-wrap">
          <canvas id="balanceChart"></canvas>
        </div>
        <div id="target-summary" class="target-summary"></div>
      </section>

      <!-- ==================== データ入力タブ ==================== -->
      <section id="tab-input" class="tab-content">

        <!-- 主役：JSON取込み -->
        <div class="card card-primary">
          <h2><span class="material-symbols-outlined icon-title">data_object</span> データを取り込む</h2>
          <p class="hint">Claudeが出力したJSONを貼り付けます。1日分でも、複数日をまとめた配列でも入ります。食事メニューを含めると摂取カロリーは自動で合計されます。</p>
          <textarea id="json-input" rows="8"
            placeholder='{"date":"2026-08-18","exercise_kcal":400,"weight_kg":78.5,"meals":[{"type":"朝食","items":[{"name":"卵かけご飯","kcal":300}]}]}'></textarea>
          <button id="import-json-btn" class="btn-primary btn-block">
            <span class="material-symbols-outlined">upload</span> 取り込む
          </button>
          <div id="import-result" class="result-msg"></div>
        </div>

        <!-- 補助：手入力（折りたたみ） -->
        <details class="accordion">
          <summary>
            <span class="material-symbols-outlined">scale</span>
            体重を手入力
            <span class="material-symbols-outlined chevron">expand_more</span>
          </summary>
          <div class="accordion-body">
            <div class="form-row">
              <input type="date" id="weight-date">
              <input type="number" step="0.1" id="weight-value" placeholder="kg">
              <button id="save-weight-btn" class="btn-secondary">保存</button>
            </div>
            <div id="weight-result" class="result-msg"></div>
          </div>
        </details>

        <details class="accordion">
          <summary>
            <span class="material-symbols-outlined">directions_run</span>
            運動の消費カロリーを手入力
            <span class="material-symbols-outlined chevron">expand_more</span>
          </summary>
          <div class="accordion-body">
            <div class="form-row">
              <input type="date" id="exercise-date">
              <input type="number" id="exercise-value" placeholder="kcal">
              <button id="save-exercise-btn" class="btn-secondary">保存</button>
            </div>
            <div id="exercise-result" class="result-msg"></div>
          </div>
        </details>
      </section>

      <!-- ==================== 履歴タブ ==================== -->
      <section id="tab-history" class="tab-content">
        <div class="period-nav">
          <button id="hist-prev" aria-label="前の月" class="icon-btn">
            <span class="material-symbols-outlined">chevron_left</span>
          </button>
          <span id="hist-label">-</span>
          <button id="hist-next" aria-label="次の月" class="icon-btn">
            <span class="material-symbols-outlined">chevron_right</span>
          </button>
        </div>
        <div id="hist-summary" class="month-summary"></div>
        <div id="history-list">
          <div class="loading-text">読み込み中...</div>
        </div>
      </section>
    </main>

    <nav id="tabbar">
      <button class="tab-btn active" data-tab="graph">
        <span class="material-symbols-outlined">monitoring</span>
        <span class="tab-label">グラフ</span>
      </button>
      <button class="tab-btn" data-tab="input">
        <span class="material-symbols-outlined">edit_square</span>
        <span class="tab-label">入力</span>
      </button>
      <button class="tab-btn" data-tab="history">
        <span class="material-symbols-outlined">history</span>
        <span class="tab-label">履歴</span>
      </button>
    </nav>
  </div>

  <!-- 上書き確認ダイアログ -->
  <div id="dialog-overlay" class="overlay hidden">
    <div class="dialog-box">
      <h3>取り込む前に確認</h3>
      <p id="dialog-message"></p>
      <div class="dialog-buttons">
        <button id="dialog-cancel" class="btn-secondary">やめる</button>
        <button id="dialog-confirm" class="btn-primary">上書きする</button>
      </div>
    </div>
  </div>

  <!-- 食事詳細ダイアログ -->
  <div id="meal-dialog-overlay" class="overlay hidden">
    <div class="dialog-box">
      <h3 id="meal-dialog-title">食事の記録</h3>
      <div id="meal-dialog-content"></div>
      <div class="dialog-buttons">
        <button id="meal-dialog-close" class="btn-secondary">閉じる</button>
      </div>
    </div>
  </div>

  <!-- 編集ダイアログ -->
  <div id="edit-dialog-overlay" class="overlay hidden">
    <div class="dialog-box">
      <h3 id="edit-dialog-title">記録を編集</h3>
      <div class="form-row-vertical">
        <label>摂取カロリー<input type="number" id="edit-intake" placeholder="kcal"></label>
        <label>運動の消費カロリー<input type="number" id="edit-exercise" placeholder="kcal"></label>
        <label>体重<input type="number" step="0.1" id="edit-weight" placeholder="kg"></label>
      </div>
      <div class="dialog-buttons">
        <button id="edit-cancel" class="btn-secondary">やめる</button>
        <button id="edit-save" class="btn-primary">保存する</button>
      </div>
    </div>
  </div>

  <!-- 削除確認ダイアログ -->
  <div id="del-dialog-overlay" class="overlay hidden">
    <div class="dialog-box">
      <h3>この日の記録を削除</h3>
      <p id="del-dialog-message"></p>
      <div class="dialog-buttons">
        <button id="del-cancel" class="btn-secondary">やめる</button>
        <button id="del-confirm" class="btn-danger">削除する</button>
      </div>
    </div>
  </div>

  <!-- トースト -->
  <div id="toast"></div>

  <?!= include('JavaScript'); ?>
</body>
</html>
