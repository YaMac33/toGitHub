<style>
  :root {
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --primary-light: #e0e7ff;
    --bg: #f6f7fb;
    --card-bg: #ffffff;
    --border: #e6e9f0;
    --text-main: #111827;
    --text-sub: #6b7280;
    --danger: #e0453a;
    --danger-light: #fdf0ef;
    --success: #129d74;
    --success-light: #e7f7f1;
    --warning: #d98324;

    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 18px;
    --shadow-sm: 0 1px 2px rgb(17 24 39 / 0.05);
    --shadow-md: 0 4px 10px -2px rgb(17 24 39 / 0.08);
    --shadow-float: 0 20px 30px -10px rgb(17 24 39 / 0.2);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text-main);
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* 数値は Outfit（等幅感のある幾何学サンセリフ）で締める */
  .num { font-family: 'Outfit', sans-serif; font-variant-numeric: tabular-nums; }

  #app { display: flex; flex-direction: column; min-height: 100vh; }

  header {
    background: var(--card-bg);
    padding: 14px 20px;
    box-shadow: var(--shadow-sm);
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: baseline; justify-content: space-between;
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 700; letter-spacing: .02em; }
  #header-date { font-size: 12px; color: var(--text-sub); font-family: 'Outfit', sans-serif; }

  main { flex: 1; padding: 16px 16px 96px; max-width: 640px; width: 100%; margin: 0 auto; }

  .tab-content { display: none; animation: fadeUp .28s ease both; }
  .tab-content.active { display: block; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* ---------- 下部タブ ---------- */
  #tabbar {
    position: fixed; bottom: 0; left: 0; right: 0;
    display: flex; justify-content: center;
    background: rgba(255,255,255,.88);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-top: 1px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom);
    z-index: 100;
  }
  .tab-btn {
    flex: 1; max-width: 213px; padding: 10px 0 8px; border: none; background: transparent;
    color: var(--text-sub); cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    transition: color .18s ease;
  }
  .tab-btn .material-symbols-outlined { font-size: 23px; transition: transform .18s ease; }
  .tab-btn .tab-label { font-size: 10px; font-weight: 600; }
  .tab-btn.active { color: var(--primary); }
  .tab-btn.active .material-symbols-outlined {
    font-variation-settings: 'FILL' 1; transform: translateY(-1px);
  }

  /* ---------- 今日の状態カード（ヒーロー） ---------- */
  .hero-card {
    background: linear-gradient(150deg, #4f46e5 0%, #6366f1 55%, #7c6df2 100%);
    border-radius: var(--radius-lg);
    padding: 22px 20px;
    margin-bottom: 12px;
    color: #fff;
    box-shadow: 0 10px 24px -8px rgb(79 70 229 / .5);
  }
  .hero-card.over {
    background: linear-gradient(150deg, #d13f34 0%, #e0453a 55%, #ef5b4f 100%);
    box-shadow: 0 10px 24px -8px rgb(224 69 58 / .45);
  }
  .hero-loading { text-align: center; padding: 30px 0; opacity: .8; font-size: 14px; }

  .hero-top { display: flex; align-items: center; gap: 20px; }

  .ring-wrap { position: relative; flex-shrink: 0; width: 118px; height: 118px; }
  .ring-wrap svg { transform: rotate(-90deg); }
  .ring-bg { stroke: rgba(255,255,255,.22); }
  .ring-fg { stroke: #fff; stroke-linecap: round; transition: stroke-dashoffset .8s cubic-bezier(.22,1,.36,1); }
  .ring-center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .ring-value { font-size: 27px; font-weight: 700; line-height: 1.05; }
  .ring-unit { font-size: 10px; opacity: .85; letter-spacing: .08em; margin-top: 2px; }

  .hero-label { font-size: 12px; opacity: .85; letter-spacing: .04em; margin-bottom: 10px; }
  .hero-side { flex: 1; min-width: 0; }
  .hero-breakdown { display: flex; flex-direction: column; gap: 7px; }
  .hero-row {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 12px; padding-bottom: 6px;
    border-bottom: 1px solid rgba(255,255,255,.18);
  }
  .hero-row:last-child { border-bottom: none; padding-bottom: 0; }
  .hero-row span:first-child { opacity: .82; }
  .hero-row strong { font-size: 15px; font-weight: 600; }

  .hero-over-note {
    margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,.25);
    font-size: 13px; font-weight: 600; text-align: center;
  }

  /* 未入力状態 */
  .hero-empty { text-align: center; padding: 6px 0 2px; }
  .hero-empty .material-symbols-outlined { font-size: 34px; opacity: .8; }
  .hero-empty h3 { margin: 8px 0 4px; font-size: 16px; font-weight: 700; }
  .hero-empty p { margin: 0 0 16px; font-size: 12.5px; opacity: .85; line-height: 1.5; }
  .btn-ghost {
    background: rgba(255,255,255,.18); color: #fff; border: 1px solid rgba(255,255,255,.35);
    border-radius: var(--radius-md); padding: 10px 20px; font-size: 13px; font-weight: 600;
    display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
    transition: background .18s ease;
  }
  .btn-ghost:hover { background: rgba(255,255,255,.28); }

  /* ---------- 目標体重の進捗 ---------- */
  .goal-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 16px 18px;
    margin-bottom: 20px;
    box-shadow: var(--shadow-sm);
  }
  .goal-head {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 12px; color: var(--text-sub); margin-bottom: 10px;
  }
  .goal-head strong { font-size: 14px; color: var(--text-main); font-weight: 700; }
  .goal-bar { height: 9px; background: var(--bg); border-radius: 99px; overflow: hidden; }
  .goal-bar-fill {
    height: 100%; border-radius: 99px;
    background: linear-gradient(90deg, #6366f1, #129d74);
    transition: width .9s cubic-bezier(.22,1,.36,1);
  }
  .goal-foot {
    display: flex; justify-content: space-between;
    font-size: 11px; color: var(--text-sub); margin-top: 7px;
  }
  .goal-note { font-size: 12px; color: var(--text-sub); text-align: center; padding: 4px 0; }
  .goal-note.warn { color: var(--danger); font-weight: 600; }

  /* ---------- 期間コントロール ---------- */
  .period-type-controls {
    display: flex; gap: 4px; margin-bottom: 14px;
    background: #eceef5; padding: 4px; border-radius: var(--radius-md);
  }
  .period-type-btn {
    flex: 1; padding: 9px 0; border-radius: var(--radius-sm);
    border: none; background: transparent; color: var(--text-sub);
    font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
    transition: all .18s ease;
  }
  .period-type-btn.active { background: var(--card-bg); color: var(--primary); box-shadow: var(--shadow-sm); }

  .period-nav {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px; padding: 0 4px;
  }
  .icon-btn {
    border: 1px solid var(--border); background: var(--card-bg); color: var(--text-sub);
    width: 34px; height: 34px; border-radius: 50%; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all .18s ease;
  }
  .icon-btn:hover { color: var(--primary); border-color: var(--primary-light); }
  .icon-btn:active { transform: scale(.94); }
  #period-label, #hist-label { font-size: 15px; font-weight: 700; font-family: 'Outfit', sans-serif; }

  .chart-wrap {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 14px 8px 8px;
    box-shadow: var(--shadow-sm);
  }

  .target-summary {
    margin-top: 12px; font-size: 12.5px; color: var(--text-sub); text-align: center;
    line-height: 1.7; background: var(--card-bg); padding: 12px;
    border-radius: var(--radius-md); border: 1px solid var(--border);
  }
  .target-summary strong { color: var(--text-main); }
  .target-summary .stat-label { display: block; font-size: 11px; letter-spacing: .06em; margin-bottom: 4px; }

  /* ---------- カード / フォーム ---------- */
  .card {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 20px; margin-bottom: 14px;
    box-shadow: var(--shadow-sm);
  }
  .card-primary { border-color: var(--primary-light); box-shadow: 0 6px 18px -10px rgb(79 70 229 / .35); }
  .card h2 {
    font-size: 16px; margin: 0 0 10px; font-weight: 700;
    display: flex; align-items: center; gap: 7px;
  }
  .icon-title { color: var(--primary); font-size: 20px; }
  .hint { font-size: 12px; color: var(--text-sub); margin: 0 0 14px; line-height: 1.6; }

  textarea, input[type="date"], input[type="number"] {
    width: 100%; background: var(--bg);
    border: 1.5px solid transparent; border-radius: var(--radius-md);
    padding: 11px 12px; font-size: 14px; margin-bottom: 12px;
    font-family: inherit; color: var(--text-main);
    transition: all .18s ease;
  }
  textarea { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; line-height: 1.6; }
  textarea:focus, input:focus {
    background: var(--card-bg); border-color: var(--primary); outline: none;
    box-shadow: 0 0 0 3px var(--primary-light);
  }

  .form-row { display: flex; gap: 8px; align-items: center; }
  .form-row input { margin-bottom: 0; }
  .form-row input[type="date"] { flex: 1.4; }
  .form-row input[type="number"] { flex: 1; }
  .form-row-vertical label {
    display: block; font-size: 12.5px; color: var(--text-sub); margin-bottom: 12px; font-weight: 500;
  }
  .form-row-vertical input { margin-top: 6px; margin-bottom: 0; }

  /* ---------- 折りたたみ（手入力） ---------- */
  .accordion {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: var(--radius-md); margin-bottom: 10px; overflow: hidden;
  }
  .accordion summary {
    list-style: none; cursor: pointer;
    padding: 14px 16px; font-size: 13.5px; font-weight: 600;
    display: flex; align-items: center; gap: 9px;
  }
  .accordion summary::-webkit-details-marker { display: none; }
  .accordion summary .material-symbols-outlined { font-size: 19px; color: var(--text-sub); }
  .accordion summary .chevron { margin-left: auto; transition: transform .22s ease; }
  .accordion[open] summary .chevron { transform: rotate(180deg); }
  .accordion[open] summary { border-bottom: 1px solid var(--border); }
  .accordion-body { padding: 14px 16px 16px; }

  /* ---------- ボタン ---------- */
  button { font-family: inherit; cursor: pointer; }
  .btn-primary, .btn-secondary, .btn-danger {
    border: none; border-radius: var(--radius-md); padding: 11px 18px;
    font-size: 14px; font-weight: 600; white-space: nowrap;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    transition: all .18s ease;
  }
  .btn-block { width: 100%; }
  .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 4px 12px -3px rgb(79 70 229 / .45); }
  .btn-primary:hover { background: var(--primary-hover); }
  .btn-primary:active { transform: scale(.985); }
  .btn-secondary { background: #eceef5; color: var(--text-main); }
  .btn-secondary:hover { background: #e2e5ef; }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-danger:hover { background: #c93a30; }

  .result-msg { font-size: 12.5px; margin-top: 8px; min-height: 16px; font-weight: 500; }
  .result-msg.success { color: var(--success); }
  .result-msg.error { color: var(--danger); }

  /* ---------- 履歴 ---------- */
  .month-summary {
    display: flex; gap: 10px; margin-bottom: 14px;
  }
  .month-stat {
    flex: 1; background: var(--card-bg); border: 1px solid var(--border);
    border-radius: var(--radius-md); padding: 12px 10px; text-align: center;
  }
  .month-stat .ms-label { font-size: 10.5px; color: var(--text-sub); letter-spacing: .04em; }
  .month-stat .ms-value { font-size: 18px; font-weight: 700; margin-top: 3px; font-family: 'Outfit', sans-serif; }
  .ms-value.good { color: var(--success); }
  .ms-value.bad { color: var(--danger); }

  .loading-text { text-align: center; color: var(--text-sub); font-size: 13.5px; padding: 28px 12px; line-height: 1.7; }

  .history-item {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: var(--radius-md); padding: 14px 16px; margin-bottom: 10px;
    box-shadow: var(--shadow-sm);
  }
  .h-header {
    display: flex; justify-content: space-between; align-items: baseline;
    padding-bottom: 9px; margin-bottom: 10px; border-bottom: 1px solid var(--border);
  }
  .h-date { font-weight: 700; font-size: 14.5px; font-family: 'Outfit', sans-serif; }
  .h-dow { font-size: 11px; color: var(--text-sub); margin-left: 5px; font-family: 'Noto Sans JP', sans-serif; }
  .h-balance { font-size: 14px; font-weight: 700; font-family: 'Outfit', sans-serif; }
  .h-balance.good { color: var(--success); }
  .h-balance.bad { color: var(--danger); }

  .h-detail { display: flex; gap: 14px; font-size: 11.5px; color: var(--text-sub); margin-bottom: 12px; flex-wrap: wrap; }
  .h-detail-item strong { color: var(--text-main); font-size: 13px; margin-left: 4px; font-family: 'Outfit', sans-serif; }

  .h-actions { display: flex; gap: 7px; justify-content: flex-end; }
  .h-actions button {
    border: none; font-size: 12px; padding: 6px 11px; border-radius: var(--radius-sm);
    font-weight: 600; display: flex; align-items: center; gap: 4px;
    background: #eceef5; color: var(--text-sub); transition: all .18s ease;
  }
  .h-actions button .material-symbols-outlined { font-size: 15px; }
  .h-actions button:hover { background: #e2e5ef; }
  .h-actions button.meals { background: var(--primary-light); color: var(--primary-hover); }
  .h-actions button.del { background: var(--danger-light); color: var(--danger); }

  /* ---------- ダイアログ ---------- */
  .overlay {
    position: fixed; inset: 0; background: rgb(17 24 39 / .45);
    backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center;
    padding: 20px; z-index: 1000;
    opacity: 1; transition: opacity .2s ease;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .dialog-box {
    background: var(--card-bg); border-radius: var(--radius-lg);
    padding: 24px; width: 100%; max-width: 380px;
    box-shadow: var(--shadow-float);
    max-height: 80vh; overflow-y: auto;
    transform: scale(1); transition: transform .22s cubic-bezier(.22,1,.36,1);
  }
  .overlay.hidden .dialog-box { transform: scale(.96); }
  .dialog-box h3 { margin: 0 0 14px; font-size: 17px; font-weight: 700; }
  .dialog-box p { font-size: 13.5px; color: var(--text-sub); line-height: 1.7; margin: 0 0 4px; }
  .dialog-buttons { display: flex; gap: 10px; margin-top: 20px; }
  .dialog-buttons button { flex: 1; }

  .meal-group { margin-bottom: 12px; background: var(--bg); padding: 12px 14px; border-radius: var(--radius-md); }
  .meal-group-title {
    font-weight: 700; font-size: 13.5px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .meal-group-total { color: var(--primary); font-family: 'Outfit', sans-serif; font-size: 13px; }
  .meal-item-row {
    display: flex; justify-content: space-between; gap: 12px;
    font-size: 12.5px; color: var(--text-sub);
    padding: 6px 0; border-bottom: 1px solid rgb(17 24 39 / .06);
  }
  .meal-item-row:last-child { border-bottom: none; padding-bottom: 0; }
  .meal-item-row span:last-child { font-family: 'Outfit', sans-serif; white-space: nowrap; }
  .meal-total-row {
    display: flex; justify-content: space-between; font-size: 13.5px; font-weight: 700;
    padding: 10px 14px; background: var(--primary-light); color: var(--primary-hover);
    border-radius: var(--radius-md);
  }

  /* ---------- トースト ---------- */
  #toast {
    position: fixed; left: 50%; bottom: 88px; transform: translate(-50%, 12px);
    background: var(--text-main); color: #fff;
    padding: 11px 20px; border-radius: 99px; font-size: 13px; font-weight: 600;
    box-shadow: var(--shadow-float); z-index: 2000;
    opacity: 0; pointer-events: none; transition: all .28s ease;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
  :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
</style>
