<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>メルカリ売上管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   デザイントークン
   モチーフ：取引伝票・複写式の control slip
   ============================================================ */
:root {
  --ink:        #14212b;
  --ink-soft:   #5c6b74;
  --paper:      #eef1ec;
  --card:       #ffffff;
  --rule:       #c6cfc8;
  --profit:     #0b6b50;
  --deduct:     #a3402d;
  --focus:      #1f6feb;

  --r: 4px;
  --gap: 16px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: 'Zen Kaku Gothic New', -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 16px;
  line-height: 1.6;
  -webkit-text-size-adjust: 100%;
}

.num {
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
}

.wrap {
  max-width: 720px;
  margin: 0 auto;
  padding: 20px 16px 64px;
}

/* ============================================================
   ヘッダーとタブ
   ============================================================ */
header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  padding-bottom: 10px;
  border-bottom: 2px solid var(--ink);
}
header h1 {
  margin: 0;
  font-size: 19px;
  font-weight: 700;
  letter-spacing: 0.06em;
}
header .meta {
  font-size: 11px;
  color: var(--ink-soft);
  letter-spacing: 0.14em;
}

/* 伝票の見出しインデックスとしてのタブ */
.tabs {
  display: flex;
  gap: 3px;
  margin-bottom: 20px;
}
.tab {
  flex: 1;
  padding: 11px 8px;
  font-family: inherit;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.1em;
  color: var(--ink-soft);
  background: #dfe4df;
  border: 1px solid var(--rule);
  border-top: none;
  border-radius: 0 0 var(--r) var(--r);
  cursor: pointer;
}
.tab[aria-selected="true"] {
  color: var(--card);
  background: var(--ink);
  border-color: var(--ink);
}
.panel[hidden] { display: none; }

/* ============================================================
   カード
   ============================================================ */
.card {
  background: var(--card);
  border: 1px solid var(--rule);
  border-radius: var(--r);
  padding: 20px 18px;
  margin-bottom: var(--gap);
}
.card > h2 {
  margin: 0 0 18px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.18em;
  color: var(--ink-soft);
  padding-bottom: 8px;
  border-bottom: 1px solid var(--rule);
}

/* ============================================================
   入力フィールド
   ============================================================ */
.field { margin-bottom: 16px; }
.field:last-child { margin-bottom: 0; }

label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  margin-bottom: 6px;
}

input, select, textarea {
  width: 100%;
  padding: 11px 12px;
  font-size: 16px; /* iOSの自動ズーム防止 */
  font-family: inherit;
  color: var(--ink);
  background: var(--card);
  border: 1px solid var(--rule);
  border-radius: var(--r);
  appearance: none;
}
textarea { resize: vertical; line-height: 1.5; min-height: 62px; }

.optional {
  font-size: 11px;
  font-weight: 400;
  color: var(--ink-soft);
  letter-spacing: 0.06em;
  margin-left: 4px;
}

input:focus-visible, select:focus-visible,
textarea:focus-visible, button:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 1px;
}
select:disabled { background: #f3f5f2; color: #9aa5ab; }

/* ============================================================
   署名要素：計算伝票
   ============================================================ */
.slip {
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px dashed var(--rule);
}
.slip-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 5px 0;
  font-size: 14px;
}
.slip-row .label { color: var(--ink-soft); }
.slip-row .label small { font-size: 11px; letter-spacing: 0.06em; margin-left: 5px; }
.slip-row .value { font-size: 15px; }
.slip-row.deduct .value { color: var(--deduct); }

.slip-total {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-top: 10px;
  padding-top: 12px;
  border-top: 3px double var(--ink);
}
.slip-total .label { font-size: 13px; font-weight: 700; letter-spacing: 0.1em; }
.slip-total .value { font-size: 27px; font-weight: 800; color: var(--profit); }
.slip-total .value.negative { color: var(--deduct); }

/* ============================================================
   ボタン
   ============================================================ */
button { font-family: inherit; cursor: pointer; border-radius: var(--r); border: 1px solid transparent; }

.btn-primary {
  width: 100%;
  margin-top: 18px;
  padding: 14px;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: #fff;
  background: var(--ink);
}
.btn-primary:hover:not(:disabled) { background: #223442; }
.btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }

.btn-del {
  padding: 3px 9px;
  font-size: 11px;
  color: var(--ink-soft);
  background: transparent;
  border-color: var(--rule);
}
.btn-del:hover { color: var(--deduct); border-color: var(--deduct); }

.btn-ghost {
  width: 100%;
  margin-top: 16px;
  padding: 10px;
  font-size: 12px;
  letter-spacing: 0.06em;
  color: var(--ink-soft);
  background: transparent;
  border-color: var(--rule);
}
.btn-ghost:hover:not(:disabled) { color: var(--ink); border-color: var(--ink); }
.btn-ghost:disabled { opacity: 0.5; cursor: not-allowed; }

/* ============================================================
   年ナビゲーション
   ============================================================ */
.year-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.year-nav .yr { font-size: 21px; font-weight: 700; letter-spacing: 0.04em; }
.nav-btn {
  width: 38px;
  height: 38px;
  font-size: 15px;
  color: var(--ink);
  background: transparent;
  border-color: var(--rule);
}
.nav-btn:hover:not(:disabled) { background: var(--paper); }
.nav-btn:disabled { opacity: 0.25; cursor: not-allowed; }

/* 年間集計：伝票の総括欄 */
.annual {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 1px;
  background: var(--rule);
  border: 1px solid var(--rule);
  border-radius: var(--r);
  overflow: hidden;
  margin-bottom: 18px;
}
.annual div { background: var(--card); padding: 10px 12px; }
.annual .k { font-size: 10px; letter-spacing: 0.12em; color: var(--ink-soft); }
.annual .v { font-size: 17px; font-weight: 700; }
.annual .v.profit { color: var(--profit); }
.annual .v.deduct { color: var(--deduct); }
.annual .full { grid-column: 1 / -1; }
.annual .full .v { font-size: 25px; font-weight: 800; }

/* ============================================================
   月別グラフ
   バー全体 = 売上 / 緑 = 収入 / 斜線 = 手数料+送料
   ============================================================ */
.legend {
  display: flex;
  gap: 14px;
  margin-bottom: 10px;
  font-size: 11px;
  color: var(--ink-soft);
}
.legend span { display: flex; align-items: center; gap: 5px; }
.legend i { width: 10px; height: 10px; border-radius: 1px; display: inline-block; }
.legend i.inc { background: var(--profit); }
.legend i.ded { background: #c3ccc6; }

.month {
  width: 100%;
  display: block;
  text-align: left;
  padding: 9px 10px;
  background: transparent;
  border: 1px solid transparent;
  border-bottom: 1px solid var(--rule);
  border-radius: 0;
}
.month:hover { background: #f6f8f5; }
.month[aria-pressed="true"] {
  background: #f2f6f3;
  border-color: var(--ink);
  border-radius: var(--r);
}
.month.empty { cursor: default; opacity: 0.5; }
.month.empty:hover { background: transparent; }

.month-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-size: 12px;
  color: var(--ink-soft);
  margin-bottom: 5px;
}
.month-head .ym { font-weight: 700; font-size: 14px; color: var(--ink); letter-spacing: 0.04em; }
.month-head .inc { font-size: 15px; font-weight: 700; color: var(--profit); }

.bar { display: flex; height: 18px; background: #edf0ec; border-radius: 2px; overflow: hidden; }
.bar-inc { background: var(--profit); }
.bar-ded {
  background: repeating-linear-gradient(
    -45deg, #c3ccc6, #c3ccc6 3px, #d3dad5 3px, #d3dad5 6px
  );
}
@media (prefers-reduced-motion: no-preference) {
  .bar-inc, .bar-ded { transition: width .35s ease; }
}

.month-foot {
  display: flex;
  gap: 12px;
  margin-top: 5px;
  font-size: 11px;
  color: var(--ink-soft);
}

/* ============================================================
   記録一覧
   ============================================================ */
.list-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  margin: 0 0 14px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--rule);
}
.list-head .t { font-size: 12px; font-weight: 700; letter-spacing: 0.18em; color: var(--ink-soft); }
.list-head .scope { font-size: 12px; color: var(--ink-soft); }
.list-head .scope button {
  margin-left: 8px;
  padding: 2px 8px;
  font-size: 11px;
  color: var(--ink-soft);
  background: transparent;
  border-color: var(--rule);
}

.entry { padding: 13px 0; border-bottom: 1px solid var(--rule); }
.entry:last-child { border-bottom: none; }

.entry-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.entry-name { font-weight: 500; font-size: 15px; word-break: break-word; }
.entry-income { font-size: 17px; font-weight: 700; color: var(--profit); white-space: nowrap; }

.entry-sub {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 5px 10px;
  margin-top: 5px;
  font-size: 12px;
  color: var(--ink-soft);
}
.tag { padding: 1px 7px; font-size: 11px; border: 1px solid var(--rule); border-radius: 2px; }

.entry-note {
  margin-top: 7px;
  padding: 6px 10px;
  font-size: 12.5px;
  color: var(--ink-soft);
  background: #f6f8f5;
  border-left: 2px solid var(--rule);
  white-space: pre-wrap;
  word-break: break-word;
}

/* ============================================================
   状態表示
   ============================================================ */
.state { padding: 28px 0; text-align: center; font-size: 13px; color: var(--ink-soft); }
.msg {
  margin-top: 14px;
  padding: 11px 13px;
  font-size: 13px;
  border-radius: var(--r);
  border: 1px solid;
}
.msg.ok  { color: var(--profit); border-color: var(--profit); background: #f0f7f4; }
.msg.err { color: var(--deduct); border-color: var(--deduct); background: #fbf1ef; }
.hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>メルカリ売上管理</h1>
    <span class="meta" id="feeLabel">手数料 10%</span>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab" id="tabRecord" role="tab" aria-selected="true"  aria-controls="panelRecord">記録する</button>
    <button class="tab" id="tabReview" role="tab" aria-selected="false" aria-controls="panelReview">集計を見る</button>
  </nav>

  <!-- ============ 記録する ============ -->
  <div class="panel" id="panelRecord" role="tabpanel" aria-labelledby="tabRecord">
    <section class="card">
      <h2>売上を記録する</h2>

      <div class="field">
        <label for="itemName">商品名</label>
        <input type="text" id="itemName" placeholder="例：〇〇のスニーカー 26cm" maxlength="200">
      </div>

      <div class="field">
        <label for="price">販売価格</label>
        <input type="number" id="price" class="num" placeholder="0" min="1" step="1" inputmode="numeric">
      </div>

      <div class="field">
        <label for="shippingMethod">配送方法</label>
        <select id="shippingMethod">
          <option value="">選択してください</option>
        </select>
      </div>

      <div class="field">
        <label for="sizeCategory">サイズ区分</label>
        <select id="sizeCategory" disabled>
          <option value="">先に配送方法を選択</option>
        </select>
      </div>

      <div class="field">
        <label for="saleDate">販売日</label>
        <input type="date" id="saleDate" class="num">
      </div>

      <div class="field">
        <label for="note">備考 <span class="optional">任意</span></label>
        <textarea id="note" rows="2" maxlength="500"
          placeholder="値下げ交渉あり、梱包材を別途購入、リピーター など"></textarea>
      </div>

      <!-- 署名要素：計算伝票 -->
      <div class="slip">
        <div class="slip-row">
          <span class="label">販売価格</span>
          <span class="value num" id="slipPrice">¥0</span>
        </div>
        <div class="slip-row deduct">
          <span class="label">販売手数料<small id="slipFeeRate">10%</small></span>
          <span class="value num" id="slipFee">−¥0</span>
        </div>
        <div class="slip-row deduct">
          <span class="label">送料<small id="slipSizeName"></small></span>
          <span class="value num" id="slipShipping">−¥0</span>
        </div>
        <div class="slip-total">
          <span class="label">収入</span>
          <span class="value num" id="slipIncome">¥0</span>
        </div>
      </div>

      <button class="btn-primary" id="saveBtn" disabled>記録する</button>
      <div class="msg hidden" id="formMsg"></div>
    </section>
  </div>

  <!-- ============ 集計を見る ============ -->
  <div class="panel" id="panelReview" role="tabpanel" aria-labelledby="tabReview" hidden>

    <section class="card">
      <div class="year-nav">
        <button class="nav-btn" id="prevYear" aria-label="前の年">◀</button>
        <span class="yr num" id="yearLabel">—</span>
        <button class="nav-btn" id="nextYear" aria-label="次の年">▶</button>
      </div>

      <div class="annual" id="annualArea"></div>

      <div class="legend">
        <span><i class="inc"></i>収入</span>
        <span><i class="ded"></i>手数料・送料</span>
      </div>
      <div id="monthArea">
        <div class="state">読み込み中…</div>
      </div>

      <button class="btn-ghost" id="exportBtn">スプレッドシートに集計を書き出す</button>
      <div class="msg hidden" id="summaryMsg"></div>
    </section>

    <section class="card">
      <div class="list-head">
        <span class="t">記録一覧</span>
        <span class="scope" id="listScope"></span>
      </div>
      <div id="listArea">
        <div class="state">読み込み中…</div>
      </div>
    </section>

  </div>

</div>

<script>
/* ============================================================
   状態
   ============================================================ */
var state = {
  shippingOptions: {},   // { 配送方法: [{size, cost}, ...] }
  feeRate: 0.10,
  summary: [],           // [{yearMonth:'2026/08', count, totalPrice, ...}]
  years: [],             // データが存在する年の配列（昇順）
  selectedYear: null,    // 表示中の年
  selectedMonth: null,   // 'yyyy/MM'。nullなら年全体を表示
  sales: [],             // 表示中の期間の売上
  saving: false
};

var el = function(id) { return document.getElementById(id); };
var yen = function(n) { return '¥' + Number(n || 0).toLocaleString('ja-JP'); };

/* ============================================================
   初期化
   ============================================================ */
window.addEventListener('DOMContentLoaded', function() {
  ['itemName', 'price', 'shippingMethod', 'sizeCategory'].forEach(function(id) {
    el(id).addEventListener('input', updateSlip);
  });
  el('shippingMethod').addEventListener('change', onMethodChange);
  el('saveBtn').addEventListener('click', onSave);
  el('exportBtn').addEventListener('click', onExport);

  el('tabRecord').addEventListener('click', function() { switchTab('record'); });
  el('tabReview').addEventListener('click', function() { switchTab('review'); });
  el('prevYear').addEventListener('click', function() { changeYear(-1); });
  el('nextYear').addEventListener('click', function() { changeYear(1); });

  google.script.run
    .withSuccessHandler(onInitialData)
    .withFailureHandler(function(err) {
      var msg = '<div class="state">データを読み込めませんでした。' +
        '画面を再読み込みしてください。<br>' + escapeHtml(err.message) + '</div>';
      el('monthArea').innerHTML = msg;
      el('listArea').innerHTML = msg;
    })
    .getInitialData();
});

function onInitialData(data) {
  state.shippingOptions = data.shippingOptions || {};
  state.feeRate = data.feeRate;
  state.summary = data.summary || [];

  // 販売日の初期値はサーバー側の今日（タイムゾーンのずれを避ける）
  el('saleDate').value = String(data.today || '').replace(/\//g, '-');

  var pct = Math.round(state.feeRate * 100) + '%';
  el('feeLabel').textContent = '手数料 ' + pct;
  el('slipFeeRate').textContent = pct;

  var sel = el('shippingMethod');
  Object.keys(state.shippingOptions).forEach(function(method) {
    var o = document.createElement('option');
    o.value = method;
    o.textContent = method;
    sel.appendChild(o);
  });

  rebuildYears(Number(String(data.today || '').slice(0, 4)));
  updateSlip();
}

/* ============================================================
   タブ切り替え
   ============================================================ */
function switchTab(name) {
  var isRecord = (name === 'record');
  el('tabRecord').setAttribute('aria-selected', isRecord);
  el('tabReview').setAttribute('aria-selected', !isRecord);
  el('panelRecord').hidden = !isRecord;
  el('panelReview').hidden = isRecord;
  window.scrollTo(0, 0);
}

/* ============================================================
   年の管理
   ============================================================ */
/**
 * 集計データから対象年の一覧を組み立てる
 * @param {number} preferYear 優先して表示したい年
 */
function rebuildYears(preferYear) {
  var set = {};
  state.summary.forEach(function(m) { set[String(m.yearMonth).slice(0, 4)] = true; });

  var thisYear = String(new Date().getFullYear());
  set[thisYear] = true;                       // データが無くても今年は表示できるようにする
  if (preferYear) set[String(preferYear)] = true;

  state.years = Object.keys(set).sort();

  // 表示中の年が一覧から消えた場合は最新年に寄せる
  var target = preferYear || state.selectedYear || Number(thisYear);
  if (state.years.indexOf(String(target)) === -1) {
    target = Number(state.years[state.years.length - 1]);
  }
  state.selectedYear = Number(target);

  renderReview();
}

function changeYear(delta) {
  var idx = state.years.indexOf(String(state.selectedYear));
  var next = idx + delta;
  if (next < 0 || next >= state.years.length) return;

  state.selectedYear = Number(state.years[next]);
  state.selectedMonth = null;   // 年を変えたら年全体の表示に戻す
  renderReview();
}

/* ============================================================
   集計画面の描画
   ============================================================ */
function renderReview() {
  var year = state.selectedYear;
  el('yearLabel').textContent = year + '年';

  var idx = state.years.indexOf(String(year));
  el('prevYear').disabled = (idx <= 0);
  el('nextYear').disabled = (idx >= state.years.length - 1);

  renderAnnual();
  renderMonths();
  loadSales();
}

/**
 * 指定年の月別データを 'yyyy/MM' をキーに引ける形で返す
 */
function monthMapOfYear() {
  var prefix = String(state.selectedYear) + '/';
  var map = {};
  state.summary.forEach(function(m) {
    if (String(m.yearMonth).indexOf(prefix) === 0) map[m.yearMonth] = m;
  });
  return map;
}

/**
 * 年間集計を描画する
 */
function renderAnnual() {
  var map = monthMapOfYear();
  var t = { count: 0, price: 0, fee: 0, shipping: 0, income: 0 };

  Object.keys(map).forEach(function(k) {
    var m = map[k];
    t.count    += Number(m.count) || 0;
    t.price    += Number(m.totalPrice) || 0;
    t.fee      += Number(m.totalFee) || 0;
    t.shipping += Number(m.totalShipping) || 0;
    t.income   += Number(m.totalIncome) || 0;
  });

  el('annualArea').innerHTML =
    '<div class="full">' +
      '<div class="k">' + state.selectedYear + '年の収入</div>' +
      '<div class="v profit num">' + yen(t.income) + '</div>' +
    '</div>' +
    '<div><div class="k">売上</div><div class="v num">' + yen(t.price) + '</div></div>' +
    '<div><div class="k">販売件数</div><div class="v num">' + t.count + '</div></div>' +
    '<div><div class="k">手数料</div><div class="v deduct num">' + yen(t.fee) + '</div></div>' +
    '<div><div class="k">送料</div><div class="v deduct num">' + yen(t.shipping) + '</div></div>';
}

/**
 * 1月〜12月のバーを描画する（データが無い月も枠として表示）
 */
function renderMonths() {
  var map = monthMapOfYear();
  var year = state.selectedYear;

  // バーの長さの基準はその年で最も売上の大きい月
  var maxPrice = 0;
  Object.keys(map).forEach(function(k) {
    maxPrice = Math.max(maxPrice, Number(map[k].totalPrice) || 0);
  });

  if (maxPrice <= 0) {
    el('monthArea').innerHTML =
      '<div class="state">' + year + '年の記録はまだありません。</div>';
    return;
  }

  var html = '';
  for (var i = 1; i <= 12; i++) {
    var ym = year + '/' + (i < 10 ? '0' + i : i);
    var m = map[ym];
    var selected = (state.selectedMonth === ym);

    if (!m) {
      html +=
        '<div class="month empty">' +
          '<div class="month-head"><span class="ym num">' + i + '月</span>' +
          '<span class="num">—</span></div>' +
        '</div>';
      continue;
    }

    var price  = Number(m.totalPrice) || 0;
    var income = Number(m.totalIncome) || 0;
    var deduct = (Number(m.totalFee) || 0) + (Number(m.totalShipping) || 0);
    var scale  = price / maxPrice;
    var incW   = price > 0 ? (income / price) * scale * 100 : 0;
    var dedW   = price > 0 ? (deduct / price) * scale * 100 : 0;

    html +=
      '<button class="month" data-ym="' + ym + '" aria-pressed="' + selected + '">' +
        '<div class="month-head">' +
          '<span class="ym num">' + i + '月</span>' +
          '<span class="inc num">' + yen(income) + '</span>' +
        '</div>' +
        '<div class="bar">' +
          '<div class="bar-inc" style="width:' + incW.toFixed(1) + '%"></div>' +
          '<div class="bar-ded" style="width:' + dedW.toFixed(1) + '%"></div>' +
        '</div>' +
        '<div class="month-foot">' +
          '<span class="num">' + m.count + '件</span>' +
          '<span class="num">売上 ' + yen(price) + '</span>' +
          '<span class="num">控除 ' + yen(deduct) + '</span>' +
        '</div>' +
      '</button>';
  }

  el('monthArea').innerHTML = html;

  // 月をタップすると一覧をその月に絞り込む（再タップで解除）
  Array.prototype.forEach.call(
    el('monthArea').querySelectorAll('.month[data-ym]'),
    function(btn) {
      btn.addEventListener('click', function() {
        var ym = btn.getAttribute('data-ym');
        state.selectedMonth = (state.selectedMonth === ym) ? null : ym;
        renderMonths();
        loadSales();
      });
    }
  );
}

/* ============================================================
   記録一覧
   ============================================================ */
/**
 * 表示中の期間（年 or 月）の売上を取得する
 */
function loadSales() {
  var prefix = state.selectedMonth || String(state.selectedYear);

  el('listScope').innerHTML = state.selectedMonth
    ? escapeHtml(state.selectedMonth.replace('/', '年') + '月')
        + '<button id="clearMonth">年全体に戻す</button>'
    : state.selectedYear + '年';

  var clearBtn = el('clearMonth');
  if (clearBtn) {
    clearBtn.addEventListener('click', function() {
      state.selectedMonth = null;
      renderMonths();
      loadSales();
    });
  }

  el('listArea').innerHTML = '<div class="state">読み込み中…</div>';

  google.script.run
    .withSuccessHandler(function(sales) {
      state.sales = sales || [];
      renderList();
    })
    .withFailureHandler(function(err) {
      el('listArea').innerHTML =
        '<div class="state">読み込めませんでした。' + escapeHtml(err.message) + '</div>';
    })
    .getSalesByPeriod(prefix);
}

function renderList() {
  var area = el('listArea');

  if (!state.sales.length) {
    area.innerHTML = '<div class="state">この期間の記録はありません。</div>';
    return;
  }

  var html = '';
  state.sales.forEach(function(s) {
    var noteHtml = s.note ? '<div class="entry-note">' + escapeHtml(s.note) + '</div>' : '';

    html +=
      '<div class="entry">' +
        '<div class="entry-head">' +
          '<span class="entry-name">' + escapeHtml(s.itemName) + '</span>' +
          '<span class="entry-income num">' + yen(s.income) + '</span>' +
        '</div>' +
        '<div class="entry-sub">' +
          '<span class="num">' + escapeHtml(String(s.saleDate)) + '</span>' +
          '<span class="tag">' + escapeHtml(s.sizeCategory) + '</span>' +
          '<span class="num">' + yen(s.price) + ' − ' + yen(s.fee) + ' − ' + yen(s.shippingCost) + '</span>' +
          '<button class="btn-del" data-row="' + s.rowIndex + '">削除</button>' +
        '</div>' +
        noteHtml +
      '</div>';
  });

  area.innerHTML = html;

  Array.prototype.forEach.call(area.querySelectorAll('.btn-del'), function(btn) {
    btn.addEventListener('click', function() {
      onDelete(Number(btn.getAttribute('data-row')), btn);
    });
  });
}

function onDelete(rowIndex, btn) {
  if (!confirm('この記録を削除します。取り消せません。')) return;

  btn.disabled = true;
  btn.textContent = '削除中…';

  google.script.run
    .withSuccessHandler(function(res) {
      if (!res.success) {
        btn.disabled = false;
        btn.textContent = '削除';
        alert(res.message);
        return;
      }
      // 行番号がずれるため、集計と一覧を取り直す
      refreshSummary();
    })
    .withFailureHandler(function(err) {
      btn.disabled = false;
      btn.textContent = '削除';
      alert('削除に失敗しました。' + err.message);
    })
    .deleteSale(rowIndex);
}

/* ============================================================
   連動プルダウン：配送方法 → サイズ区分
   ============================================================ */
function onMethodChange() {
  var method = el('shippingMethod').value;
  var sizeSel = el('sizeCategory');
  sizeSel.innerHTML = '';

  if (!method) {
    sizeSel.disabled = true;
    sizeSel.appendChild(newOption('', '先に配送方法を選択'));
    updateSlip();
    return;
  }

  sizeSel.disabled = false;
  sizeSel.appendChild(newOption('', '選択してください'));
  (state.shippingOptions[method] || []).forEach(function(opt) {
    sizeSel.appendChild(newOption(opt.size, opt.size + '  ' + yen(opt.cost)));
  });

  updateSlip();
}

function newOption(value, text) {
  var o = document.createElement('option');
  o.value = value;
  o.textContent = text;
  return o;
}

/* ============================================================
   計算伝票をリアルタイム更新
   ※ サーバー側 calcIncome() と同じ計算式（手数料は切り捨て）
   ============================================================ */
function currentShippingCost() {
  var method = el('shippingMethod').value;
  var size = el('sizeCategory').value;
  if (!method || !size) return null;

  var list = state.shippingOptions[method] || [];
  for (var i = 0; i < list.length; i++) {
    if (list[i].size === size) return list[i].cost;
  }
  return null;
}

function updateSlip() {
  var price = Math.floor(Number(el('price').value) || 0);
  var fee = Math.floor(price * state.feeRate);
  var shipping = currentShippingCost();
  var income = price - fee - (shipping || 0);

  el('slipPrice').textContent = yen(price);
  el('slipFee').textContent = price ? '−' + yen(fee) : '−¥0';
  el('slipShipping').textContent = (shipping === null) ? '—' : '−' + yen(shipping);
  el('slipSizeName').textContent = el('sizeCategory').value || '';

  var incomeEl = el('slipIncome');
  incomeEl.textContent = yen(income);
  incomeEl.classList.toggle('negative', income < 0);

  var ready = !!el('itemName').value.trim() && price > 0 && shipping !== null;
  el('saveBtn').disabled = !ready || state.saving;
}

/* ============================================================
   保存
   ============================================================ */
function onSave() {
  if (state.saving) return;
  state.saving = true;
  el('saveBtn').disabled = true;
  el('saveBtn').textContent = '記録中…';
  el('formMsg').className = 'msg hidden';

  google.script.run
    .withSuccessHandler(onSaved)
    .withFailureHandler(function(err) {
      finishSave();
      showMsg('err', '通信に失敗しました。' + err.message);
    })
    .addSale({
      itemName: el('itemName').value.trim(),
      price: Math.floor(Number(el('price').value) || 0),
      shippingMethod: el('shippingMethod').value,
      sizeCategory: el('sizeCategory').value,
      saleDate: el('saleDate').value,
      note: el('note').value.trim()
    });
}

function onSaved(res) {
  finishSave();

  if (!res.success) {
    showMsg('err', res.message);
    return;
  }

  showMsg('ok', '記録しました　収入 ' + yen(res.record.income));

  // 商品名・価格・備考を消し、配送方法と日付は次の入力用に残す
  el('itemName').value = '';
  el('price').value = '';
  el('note').value = '';
  el('itemName').focus();
  updateSlip();

  refreshSummary();
}

function finishSave() {
  state.saving = false;
  el('saveBtn').textContent = '記録する';
  updateSlip();
}

/* ============================================================
   集計の再取得
   ============================================================ */
function refreshSummary() {
  google.script.run
    .withSuccessHandler(function(rows) {
      state.summary = rows || [];
      rebuildYears(state.selectedYear);
    })
    .getSummary();
}

/**
 * スプレッドシートのSummaryシートへ書き出す
 */
function onExport() {
  var btn = el('exportBtn');
  btn.disabled = true;
  btn.textContent = '書き出し中…';
  el('summaryMsg').className = 'msg hidden';

  var done = function(cls, text) {
    btn.disabled = false;
    btn.textContent = 'スプレッドシートに集計を書き出す';
    var m = el('summaryMsg');
    m.className = 'msg ' + cls;
    m.textContent = text;
  };

  google.script.run
    .withSuccessHandler(function(res) {
      done(res.success ? 'ok' : 'err',
        res.success ? res.message + '。Summaryシートにグラフも作成しました。' : res.message);
    })
    .withFailureHandler(function(err) {
      done('err', '書き出しに失敗しました。' + err.message);
    })
    .updateSummary();
}

/* ============================================================
   ユーティリティ
   ============================================================ */
function showMsg(type, text) {
  var m = el('formMsg');
  m.className = 'msg ' + type;
  m.textContent = text;
}

function escapeHtml(str) {
  return String(str == null ? '' : str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
</script>
