<style>
  :root {
    --bg: #f6f7fb;
    --surface: #ffffff;
    --surface-alt: #f9fafc;
    --fg: #16181d;
    --sub: #6b7280;
    --line: #e6e8ee;
    --head-bg: #f1f3f9;
    --accent: #4f6bff;
    --accent-fg: #ffffff;
    --error: #d9483f;
    --error-bg: #fdf1f0;
    --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 8px 24px rgba(16, 24, 40, .06);
    --shadow-sm: 0 1px 3px rgba(16, 24, 40, .08);
    --radius: 14px;
    --radius-sm: 10px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans",
                 "Noto Sans JP", sans-serif;
    background: var(--bg);
    color: var(--fg);
    -webkit-text-size-adjust: 100%;
  }

  /* ページ全体は固定高さでスクロールさせず、テーブル領域(.table-wrap)だけを
     内部スクロールさせる。固定行数・固定列数の position:sticky はこの
     内部スクロールを基準に計算されるため、ここが効いていないと固定されない。 */
  body {
    display: flex;
    flex-direction: column;
  }

  #main {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  ::selection { background: color-mix(in srgb, var(--accent) 30%, transparent); }

  /* ============ ヘッダー ============ */

  .app-header {
    flex: none;
    position: sticky;
    top: 0;
    z-index: 30;
    background: color-mix(in srgb, var(--surface) 88%, transparent);
    backdrop-filter: blur(14px) saturate(1.2);
    -webkit-backdrop-filter: blur(14px) saturate(1.2);
    border-bottom: 1px solid var(--line);
    padding: 12px 16px 10px;
    transition: box-shadow .25s ease;
  }

  .app-header.is-scrolled {
    box-shadow: var(--shadow);
  }

  .header-top {
    display: flex;
    align-items: center;
    margin-bottom: 10px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--fg);
  }

  .brand-mark {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 60%, #7c3aed));
    color: #fff;
  }

  .brand-text {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .01em;
  }

  .header-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .select-wrap {
    position: relative;
    flex: 1;
    min-width: 0;
  }

  #sheetSelect {
    width: 100%;
    appearance: none;
    -webkit-appearance: none;
    padding: 11px 36px 11px 12px;
    font-size: 15px;
    font-family: inherit;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    background: var(--surface);
    color: var(--fg);
    box-shadow: var(--shadow-sm);
    transition: border-color .15s ease, box-shadow .15s ease, transform .1s ease;
  }

  #sheetSelect:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }

  #sheetSelect:focus-visible {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);
  }

  #sheetSelect:disabled { opacity: .6; }

  .select-chevron {
    position: absolute;
    right: 11px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--sub);
    pointer-events: none;
  }

  #settingsBtn,
  #reloadBtn {
    flex: none;
    width: 44px;
    height: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    background: var(--surface);
    color: var(--accent);
    box-shadow: var(--shadow-sm);
    cursor: pointer;
    transition: background .15s ease, transform .1s ease, border-color .15s ease;
  }

  #settingsBtn:hover,
  #reloadBtn:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
  #settingsBtn:active,
  #reloadBtn:active { transform: scale(.93); }
  #settingsBtn:focus-visible,
  #reloadBtn:focus-visible {
    outline: none;
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);
  }
  #settingsBtn:disabled,
  #reloadBtn:disabled { opacity: .6; cursor: default; }

  #settingsBtn svg { transition: transform .2s ease; }
  #settingsBtn[aria-expanded="true"] {
    color: var(--accent-fg);
    background: var(--accent);
    border-color: var(--accent);
  }
  #settingsBtn[aria-expanded="true"] svg { transform: rotate(45deg); }

  #reloadBtn.spinning svg { animation: spin .9s cubic-bezier(.5, .15, .5, .85) infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .settings-panel {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 10px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    background: var(--surface-alt);
    animation: fadeIn .18s ease;
  }
  .settings-panel[hidden] { display: none; }

  .settings-field {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--sub);
  }

  .settings-field input {
    width: 56px;
    padding: 6px 8px;
    font-size: 13px;
    font-family: inherit;
    color: var(--fg);
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface);
    transition: border-color .15s ease, box-shadow .15s ease;
  }

  .settings-field input:focus-visible {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);
  }

  .status {
    margin-top: 8px;
    font-size: 12px;
    color: var(--sub);
    min-height: 15px;
    transition: opacity .2s ease;
  }

  /* ============ メッセージ / エラー ============ */

  .message {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: auto;
    margin: 14px;
    padding: 20px;
    border: 1px solid color-mix(in srgb, var(--error) 25%, var(--line));
    border-radius: var(--radius);
    font-size: 14px;
    line-height: 1.7;
    color: var(--error);
    background: var(--error-bg);
    text-align: center;
    animation: fadeIn .25s ease;
  }
  .message[hidden] { display: none; }

  .message-icon { margin-bottom: 8px; }

  .message-text {
    margin: 0;
    white-space: pre-line;
    color: var(--fg);
    opacity: .85;
  }

  .retry-btn {
    margin-top: 14px;
    padding: 9px 18px;
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    border: none;
    border-radius: var(--radius-sm);
    background: var(--accent);
    color: var(--accent-fg);
    cursor: pointer;
    transition: transform .1s ease, opacity .15s ease;
  }
  .retry-btn:hover { opacity: .92; }
  .retry-btn:active { transform: scale(.96); }

  /* ============ スケルトン読み込み ============ */

  .skeleton {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .skeleton[hidden] { display: none; }

  .skeleton-row {
    height: 34px;
    border-radius: 8px;
    background: linear-gradient(90deg,
      var(--surface-alt) 25%,
      var(--head-bg) 37%,
      var(--surface-alt) 63%);
    background-size: 400% 100%;
    animation: shimmer 1.4s ease infinite;
  }
  .skeleton-row:first-child { opacity: .9; }
  @keyframes shimmer {
    0% { background-position: 100% 50%; }
    100% { background-position: 0 50%; }
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ============ テーブル ============ */

  /* table-card: 角丸の見た目だけを担当する非スクロール要素。
     sticky の基準(最も近いスクロール祖先)を table-wrap にするため、
     overflow:hidden はこの外側だけに持たせる。 */
  .table-card {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    margin: 14px;
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    background: var(--surface);
  }

  .table-wrap {
    flex: 1;
    min-height: 0;
    overflow: auto;
    max-width: 100%;
    -webkit-overflow-scrolling: touch;
    animation: fadeIn .3s ease;
  }

  .table-wrap::-webkit-scrollbar { width: 10px; height: 10px; }
  .table-wrap::-webkit-scrollbar-track { background: transparent; }
  .table-wrap::-webkit-scrollbar-thumb {
    background: color-mix(in srgb, var(--sub) 35%, transparent);
    border-radius: 10px;
    border: 2px solid var(--bg);
  }
  .table-wrap::-webkit-scrollbar-thumb:hover {
    background: color-mix(in srgb, var(--sub) 55%, transparent);
  }

  table {
    border-collapse: separate;
    border-spacing: 0;
    font-size: 13px;
    white-space: nowrap;
  }

  th, td {
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    padding: 9px 12px;
    text-align: left;
    max-width: 240px;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  tbody tr:last-child th,
  tbody tr:last-child td { border-bottom: none; }

  tr th:last-child, tr td:last-child { border-right: none; }

  tbody tr:nth-child(even) { background: var(--surface-alt); }

  tbody tr {
    transition: background-color .12s ease;
  }

  tbody tr:hover {
    background: color-mix(in srgb, var(--accent) 8%, var(--surface));
  }

  /* ---- 固定行・固定列(可変) ----
     .title-row / .title-col: 1行目・1列目の見出し書式(常に太字・見出し色)。
     .sticky-top / .sticky-left / .sticky-corner: 実際に固定するセル
     (JSが固定行数・固定列数に応じて動的に top/left を計算して付与する)。 */

  .title-row,
  .title-col {
    background: var(--head-bg);
    font-weight: 600;
    color: var(--fg);
  }

  .sticky-top,
  .sticky-left {
    position: sticky;
  }

  .sticky-top { z-index: 10; }
  .sticky-left { z-index: 5; }
  .sticky-corner { z-index: 20; }

  /* 見出しではない固定セルは、下に隠れる本文セルと同じ縞模様色で塗って
     スクロール時の透け(コンテンツが透けて見える現象)を防ぐ。 */
  tbody tr .sticky-top:not(.title-row):not(.title-col),
  tbody tr .sticky-left:not(.title-row):not(.title-col) {
    background: var(--surface);
  }
  tbody tr:nth-child(even) .sticky-top:not(.title-row):not(.title-col),
  tbody tr:nth-child(even) .sticky-left:not(.title-row):not(.title-col) {
    background: var(--surface-alt);
  }
  tbody tr:hover .sticky-top:not(.title-row):not(.title-col),
  tbody tr:hover .sticky-left:not(.title-row):not(.title-col) {
    background: color-mix(in srgb, var(--accent) 8%, var(--surface));
  }

  tbody tr:hover .title-col {
    background: color-mix(in srgb, var(--accent) 14%, var(--head-bg));
  }
</style>
