<script>
'use strict';

const els = {
  select:  document.getElementById('sheetSelect'),
  reload:  document.getElementById('reloadBtn'),
  status:  document.getElementById('status'),
  message: document.getElementById('message'),
  wrap:    document.getElementById('tableWrap'),
};

/* ============ google.script.run を Promise化 ============ */

function gsRun(fnName, ...args) {
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(err => reject(new Error(err && err.message || err)))
      [fnName](...args);
  });
}

/* ============ 表示ヘルパー ============ */

function setStatus(text) {
  els.status.textContent = text;
}

function showMessage(text) {
  els.message.textContent = text;
  els.message.hidden = false;
  els.wrap.innerHTML = '';
}

function hideMessage() {
  els.message.hidden = true;
}

function setBusy(busy) {
  els.reload.classList.toggle('spinning', busy);
  els.reload.disabled = busy;
  els.select.disabled = busy;
}

function formatTime(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return '不明';
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())} `
       + `${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

/**
 * 1行目を見出し行、1列目を見出し列として描画。
 * DocumentFragmentでまとめてから一括挿入(数千行でも比較的軽い)。
 */
function renderTable(values) {
  els.wrap.innerHTML = '';
  if (!values || values.length === 0) {
    showMessage('このシートにはデータがありません。');
    return;
  }
  hideMessage();

  const frag = document.createDocumentFragment();
  const table = document.createElement('table');

  const thead = document.createElement('thead');
  const headTr = document.createElement('tr');
  values[0].forEach((cell, i) => {
    const th = document.createElement('th');
    th.textContent = cell;
    th.scope = 'col';
    if (i === 0) th.className = 'corner';
    headTr.appendChild(th);
  });
  thead.appendChild(headTr);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');
  for (let r = 1; r < values.length; r++) {
    const tr = document.createElement('tr');
    const row = values[r];
    for (let c = 0; c < row.length; c++) {
      const cellEl = document.createElement(c === 0 ? 'th' : 'td');
      if (c === 0) {
        cellEl.className = 'rowhead';
        cellEl.scope = 'row';
      }
      cellEl.textContent = row[c];
      tr.appendChild(cellEl);
    }
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);

  frag.appendChild(table);
  els.wrap.appendChild(frag);
}

function fillSelect(names, selected) {
  els.select.innerHTML = '';
  names.forEach(name => {
    const opt = document.createElement('option');
    opt.value = name;
    opt.textContent = name;
    els.select.appendChild(opt);
  });
  if (selected && names.includes(selected)) els.select.value = selected;
}

/* ============ 読み込みフロー ============ */

async function loadSheet(sheetName) {
  setBusy(true);
  setStatus('読み込み中…');
  try {
    const data = await gsRun('getSheetData', sheetName);
    renderTable(data.values);
    setStatus(`最終更新: ${formatTime(data.fetchedAt)}(${data.rows}行 × ${data.cols}列)`);
    gsRun('saveLastSheet', sheetName).catch(() => {}); // 記憶保存は失敗しても無視
  } catch (err) {
    console.error(err);
    setStatus('');
    showMessage('データの取得に失敗しました。\n' + err.message + '\n\n再読み込みボタンでもう一度お試しください。');
  } finally {
    setBusy(false);
  }
}

async function onSelectChange() {
  const name = els.select.value;
  if (!name) return;
  await loadSheet(name);
}

/* ============ 起動 ============ */

async function init() {
  els.select.addEventListener('change', onSelectChange);
  els.reload.addEventListener('click', () => {
    if (els.select.value) loadSheet(els.select.value);
  });

  setBusy(true);
  setStatus('シート一覧を取得中…');

  try {
    const [names, lastSheet] = await Promise.all([
      gsRun('getSheetNames'),
      gsRun('getLastSheet'),
    ]);

    if (!names || names.length === 0) {
      showMessage('シートが見つかりませんでした。');
      setStatus('');
      return;
    }

    fillSelect(names, lastSheet);
    await loadSheet(els.select.value || names[0]);
  } catch (err) {
    console.error(err);
    setStatus('');
    showMessage('初期化に失敗しました。\n' + err.message);
  } finally {
    setBusy(false);
  }
}

init();
</script>
