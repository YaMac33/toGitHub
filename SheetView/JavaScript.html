<script>
'use strict';


const els = {
  header:       document.getElementById('appHeader'),
  select:       document.getElementById('sheetSelect'),
  reload:       document.getElementById('reloadBtn'),
  settingsBtn:  document.getElementById('settingsBtn'),
  settingsPanel:document.getElementById('settingsPanel'),
  freezeRows:   document.getElementById('freezeRowsInput'),
  freezeCols:   document.getElementById('freezeColsInput'),
  status:       document.getElementById('status'),
  message:      document.getElementById('message'),
  messageText:  document.getElementById('messageText'),
  messageRetry: document.getElementById('messageRetry'),
  skeleton:     document.getElementById('skeleton'),
  wrap:         document.getElementById('tableWrap'),
};


let lastSheetRequested = '';
let currentValues = null;
let currentFormats = null;   // ← 追加
let freezeConfig = { rows: 2, cols: 1 };


/* ============ google.script.run を Promise化 ============ */


function gsRun(fnName, ...args) {
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(err => reject(new Error(err && err.message || err)))
      [fnName](...args);
  });
}


/* ============ 表示ヘルパー ============ */


function setStatus(text) {
  els.status.textContent = text;
}


function showMessage(text, { retry = false } = {}) {
  els.messageText.textContent = text;
  els.messageRetry.hidden = !retry;
  els.message.hidden = false;
  els.skeleton.hidden = true;
  els.wrap.innerHTML = '';
}


function hideMessage() {
  els.message.hidden = true;
}


function setBusy(busy) {
  els.reload.classList.toggle('spinning', busy);
  els.reload.disabled = busy;
  els.select.disabled = busy;
}


function showSkeleton() {
  hideMessage();
  els.wrap.innerHTML = '';
  els.skeleton.hidden = false;
}


function hideSkeleton() {
  els.skeleton.hidden = true;
}


function formatTime(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return '不明';
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())} `
       + `${pad(d.getHours())}:${pad(d.getMinutes())}`;
}


function clampInt(value, min, max) {
  const n = parseInt(value, 10);
  if (!Number.isFinite(n)) return min;
  return Math.max(min, Math.min(max, n));
}


/* ============ テーブル描画 ============ */


/**
 * 1行目を見出し行、1列目を見出し列として描画。
 * 固定行数・固定列数はfreezeで指定し、その範囲のセルにposition:stickyを付与する。
 */
function renderTable(values, formats, freeze) {
  els.wrap.innerHTML = '';
  if (!values || values.length === 0) {
    showMessage('このシートにはデータがありません。');
    return;
  }
  hideMessage();


  const table = document.createElement('table');
  const thead = document.createElement('thead');
  const tbody = document.createElement('tbody');


  values.forEach((row, r) => {
    const tr = document.createElement('tr');
    const isHeaderRow = r === 0;
    row.forEach((cell, c) => {
      const isHeaderCol = c === 0;
      const el = document.createElement(isHeaderRow || isHeaderCol ? 'th' : 'td');
      el.textContent = cell;
      if (isHeaderRow) {
        el.scope = 'col';
        el.classList.add('title-row');
      } else if (isHeaderCol) {
        el.scope = 'row';
        el.classList.add('title-col');
      }


      // ---- 書式の適用 ----
      const f = formats && formats[r] && formats[r][c];
      if (f) applyCellFormat(el, f);


      tr.appendChild(el);
    });
    (isHeaderRow ? thead : tbody).appendChild(tr);
  });


  table.appendChild(thead);
  table.appendChild(tbody);


  const frag = document.createDocumentFragment();
  frag.appendChild(table);
  els.wrap.appendChild(frag);


  applyFreeze(table, freeze);
}


/* セルにシートの書式(塗りつぶし・取り消し線など)を反映する */
function applyCellFormat(el, f) {
  // 塗りつぶし(白・既定色でない場合のみ上書き)
  if (f.bg && f.bg !== '#ffffff' && f.bg.toLowerCase() !== '#ffffff') {
    el.style.backgroundColor = f.bg;
    el.classList.add('has-fill');   // 縞模様CSSに勝たせるための目印
  }
  // 文字色
  if (f.color && f.color !== '#000000') {
    el.style.color = f.color;
  }
  // 取り消し線 / 下線
  if (f.line === 'line-through') {
    el.style.textDecoration = 'line-through';
  } else if (f.line === 'underline') {
    el.style.textDecoration = 'underline';
  }
  // 太字・斜体
  if (f.weight === 'bold')   el.style.fontWeight = '700';
  if (f.style === 'italic')  el.style.fontStyle = 'italic';
}


function applyFreeze(table, freeze) {
  const rows = Array.from(table.rows);
  if (rows.length === 0) return;


  const freezeRows = Math.max(0, Math.min(freeze.rows, rows.length));
  const freezeCols = Math.max(0, Math.min(freeze.cols, rows[0].cells.length));


  const tops = [];
  let topAcc = 0;
  for (let r = 0; r < freezeRows; r++) {
    tops.push(topAcc);
    topAcc += rows[r].offsetHeight;
  }


  const lefts = [];
  let leftAcc = 0;
  for (let c = 0; c < freezeCols; c++) {
    lefts.push(leftAcc);
    leftAcc += rows[0].cells[c].offsetWidth;
  }


  rows.forEach((row, r) => {
    const isFrozenRow = r < freezeRows;
    Array.from(row.cells).forEach((cell, c) => {
      const isFrozenCol = c < freezeCols;
      if (!isFrozenRow && !isFrozenCol) return;


      if (isFrozenRow) {
        cell.classList.add('sticky-top');
        cell.style.top = tops[r] + 'px';
      }
      if (isFrozenCol) {
        cell.classList.add('sticky-left');
        cell.style.left = lefts[c] + 'px';
      }
      if (isFrozenRow && isFrozenCol) {
        cell.classList.add('sticky-corner');
      }
    });
  });
}


function fillSelect(names, selected) {
  els.select.innerHTML = '';
  names.forEach(name => {
    const opt = document.createElement('option');
    opt.value = name;
    opt.textContent = name;
    els.select.appendChild(opt);
  });
  if (selected && names.includes(selected)) els.select.value = selected;
}


function setFreezeInputs(freeze) {
  els.freezeRows.value = freeze.rows;
  els.freezeCols.value = freeze.cols;
}


/* ============ 読み込みフロー ============ */


async function loadSheet(sheetName) {
  lastSheetRequested = sheetName;
  setBusy(true);
  setStatus('読み込み中…');
  showSkeleton();
  try {
    const data = await gsRun('getSheetData', sheetName);
    currentValues = data.values;
    currentFormats = data.formats;                    // ← 追加
    hideSkeleton();
    renderTable(currentValues, currentFormats, freezeConfig);   // ← 引数追加
    setStatus(`最終更新: ${formatTime(data.fetchedAt)} ・ ${data.rows}行 × ${data.cols}列`);
    gsRun('saveLastSheet', sheetName).catch(() => {}); // 記憶保存は失敗しても無視
  } catch (err) {
    console.error(err);
    setStatus('');
    showMessage('データの取得に失敗しました。\n' + err.message, { retry: true });
  } finally {
    hideSkeleton();
    setBusy(false);
  }
}


async function onSelectChange() {
  const name = els.select.value;
  if (!name) return;
  await loadSheet(name);
}


function onFreezeInputChange() {
  const maxRows = currentValues ? currentValues.length : 999;
  const maxCols = currentValues && currentValues[0] ? currentValues[0].length : 999;
  freezeConfig = {
    rows: clampInt(els.freezeRows.value, 0, maxRows),
    cols: clampInt(els.freezeCols.value, 0, maxCols),
  };
  setFreezeInputs(freezeConfig);
  gsRun('saveFreezeConfig', freezeConfig.rows, freezeConfig.cols).catch(() => {});
  if (currentValues) renderTable(currentValues, currentFormats, freezeConfig);   // ← 引数追加
}


function onSettingsToggle() {
  const expanded = els.settingsBtn.getAttribute('aria-expanded') === 'true';
  els.settingsBtn.setAttribute('aria-expanded', String(!expanded));
  els.settingsPanel.hidden = expanded;
}


/* ============ 起動 ============ */


function bindEvents() {
  els.select.addEventListener('change', onSelectChange);
  els.reload.addEventListener('click', () => {
    if (els.select.value) loadSheet(els.select.value);
  });
  els.settingsBtn.addEventListener('click', onSettingsToggle);
  els.freezeRows.addEventListener('change', onFreezeInputChange);
  els.freezeCols.addEventListener('change', onFreezeInputChange);
  els.messageRetry.addEventListener('click', () => {
    if (lastSheetRequested) loadSheet(lastSheetRequested);
    else boot();
  });
  els.wrap.addEventListener('scroll', () => {
    els.header.classList.toggle('is-scrolled', els.wrap.scrollTop > 0);
  }, { passive: true });
}


async function boot() {
  setBusy(true);
  setStatus('シート一覧を取得中…');
  showSkeleton();


  try {
    const [names, lastSheet, freeze] = await Promise.all([
      gsRun('getSheetNames'),
      gsRun('getLastSheet'),
      gsRun('getFreezeConfig'),
    ]);


    freezeConfig = freeze;
    setFreezeInputs(freezeConfig);


    if (!names || names.length === 0) {
      hideSkeleton();
      showMessage('シートが見つかりませんでした。');
      setStatus('');
      return;
    }


    fillSelect(names, lastSheet);
    await loadSheet(els.select.value || names[0]);
  } catch (err) {
    console.error(err);
    setStatus('');
    hideSkeleton();
    showMessage('初期化に失敗しました。\n' + err.message, { retry: true });
  } finally {
    setBusy(false);
  }
}


bindEvents();
boot();
</script>
